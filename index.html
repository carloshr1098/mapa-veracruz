<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Oficialías - Veracruz</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; }
        
        /* --- CABECERA RESPONSIVE --- */
        header { background-color: #6a1b31; color: white; padding: 1rem; text-align: center; height: auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        header h1 { margin: 0; font-size: 1.5rem; margin-bottom: 0.5rem; } 
        
        .header-search { display: none; width: 100%; max-width: 400px; } 
        .header-search input { padding: 10px 15px; font-size: 1rem; border: none; border-radius: 5px; width: 100%; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-search input:focus { box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        main { height: calc(100vh - 120px); width: 100%; position: relative; } 
        #map-container { height: 100%; width: 100%; z-index: 1; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.9); padding: 15px 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 999; font-weight: bold; color: #6a1b31; }

        /* EL BUSCADOR PC */
        .pc-search-box { display: none; position: absolute; top: 20px; right: 20px; z-index: 1000; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex-direction: column; gap: 10px; }
        .pc-search-box label { color: #6a1b31; font-weight: bold; font-size: 0.9rem; }
        .pc-search-box input { padding: 10px 15px; font-size: 1rem; border: 2px solid #ccc; border-radius: 5px; width: 250px; outline: none; transition: border-color 0.3s; }
        .pc-search-box input:focus { border-color: #6a1b31; }

        /* --- NUEVA CAJA DE FILTROS --- */
        #filtros-box { position: absolute; bottom: 85px; left: 20px; z-index: 1000; background: white; padding: 12px 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 8px; }
        #filtros-box h3 { margin: 0 0 5px 0; font-size: 0.95rem; color: #6a1b31; text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        .filtro-label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; color: #333; font-weight: bold; }
        .filtro-label input { accent-color: #6a1b31; transform: scale(1.3); cursor: pointer;}

        #btn-reset { position: absolute; bottom: 30px; left: 20px; z-index: 1000; padding: 12px 20px; background: #6a1b31; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.3s; width: calc(100% - 40px); max-width: 200px; text-align: center;}
        #btn-reset:hover { background: #8a2542; }

        /* DISEÑO DE LA TARJETA EMERGENTE (Popup) */
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; overflow: hidden; }
        .custom-popup .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-header { color: white; padding: 10px 15px; font-size: 1.1em; font-weight: bold; }
        .popup-body { padding: 15px; font-size: 0.9em; color: #333; }
        .popup-item { margin-bottom: 8px; display: flex; align-items: flex-start; }
        .popup-icon { margin-right: 10px; font-size: 1.2em; }
        
        .popup-link { color: #007bff; text-decoration: none; word-break: break-all; }
        .popup-link:hover { text-decoration: underline; }
        
        .popup-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #6a1b31; margin: 10px auto 15px auto; display: block; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .custom-pin { background: transparent; border: none; }

        /* ADAPTACIÓN PC VS MÓVIL */
        @media (min-width: 768px) {
            header { flex-direction: row; height: 60px; padding: 1rem; } 
            header h1 { margin: 0; font-size: 1.5rem; margin-right: auto; } 
            .header-search { display: none; } 
            main { height: calc(100vh - 60px); } 
            .pc-search-box { display: flex; } 
            #btn-reset { max-width: none; width: auto; }
        }

        @media (max-width: 767px) {
            .header-search { display: block; } 
            .pc-search-box { display: none; } 
            #filtros-box { bottom: 90px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Directorio de Oficialías</h1>
        <div class="header-search">
            <input type="text" id="buscador-header" placeholder="Busca un municipio y presiona Ir/Enter..." autocomplete="off">
        </div>
    </header>

    <main>
        <div class="pc-search-box">
            <label for="buscador-pc">Buscar Oficialía:</label>
            <input type="text" id="buscador-pc" placeholder="Escribe un municipio..." list="lista-municipios" autocomplete="off">
            <datalist id="lista-municipios"></datalist>
        </div>

        <div id="filtros-box">
            <h3>Filtros Rápidos</h3>
            <label class="filtro-label">
                <input type="checkbox" id="chk-curp"> ✅ Solo Módulo CURP
            </label>
            <label class="filtro-label">
                <input type="checkbox" id="chk-bio"> 👁️ Solo Módulo Biométrico
            </label>
        </div>

        <button id="btn-reset">🗺️ Ver todo Veracruz</button>
        <div id="loading">Cargando mapa oficial de Veracruz...</div>
        <div id="map-container"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const map = L.map('map-container', { minZoom: 6, maxZoom: 18 });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OSM'
            }).addTo(map);

            let veracruzBounds;  
            const grupoOficialias = L.layerGroup(); 
            const NIVEL_ZOOM_VISIBLE = 10; 
            let diccMarcadores = {}; 
            
            // --- NUEVO: Arreglo para guardar TODOS los marcadores y poder filtrarlos ---
            const todosLosMarcadores = []; 

            const urlPoligonoVeracruz = 'https://nominatim.openstreetmap.org/search?state=Veracruz&country=Mexico&polygon_geojson=1&format=json';

            fetch(urlPoligonoVeracruz)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none'; 
                    const veracruzGeoJSON = data[0].geojson; 
                    
                    const polygonStyle = { color: "#6a1b31", weight: 2, opacity: 0.8, fillColor: "#6a1b31", fillOpacity: 0.15 };
                    const geoJsonLayer = L.geoJSON(veracruzGeoJSON, { style: polygonStyle }).addTo(map);

                    veracruzBounds = geoJsonLayer.getBounds();
                    map.fitBounds(veracruzBounds);
                    map.setMaxBounds(veracruzBounds.pad(0.2)); 
                })
                .catch(error => { console.error("Error al cargar el polígono:", error); });

            fetch('csvjson.json')
                .then(response => response.json())
                .then(datos => {
                    const datalist = document.getElementById('lista-municipios');

                    datos.forEach(item => {
                        const nombre = item.MUNICIPIO || item.municipio;
                        const direccion = item.DIRECCION || item.direccion || "Sin dirección";
                        
                        let telefonoRaw = item.telefono || item.Telefono || "No disponible";
                        let telefonoHTML = "";

                        if (String(telefonoRaw).toUpperCase().includes("NO TIENE") || telefonoRaw === "No disponible") {
                            telefonoHTML = `<span>${telefonoRaw}</span>`;
                        } else {
                            let listaTelefonos = String(telefonoRaw).split(/[\n/,]| y | Y | o | O /);
                            let enlacesGenerados = [];

                            listaTelefonos.forEach(tel => {
                                let telLimpio = tel.trim();
                                if (telLimpio.length > 0) {
                                    let soloNumeros = telLimpio.replace(/\D/g, ''); 
                                    
                                    if (soloNumeros.length >= 7) {
                                        enlacesGenerados.push(`<a href="tel:${soloNumeros}" class="popup-link" style="display: block; margin-bottom: 3px;">${telLimpio}</a>`);
                                    } else {
                                        enlacesGenerados.push(`<span style="display: block; margin-bottom: 3px;">${telLimpio}</span>`);
                                    }
                                }
                            });
                            
                            telefonoHTML = enlacesGenerados.join('');
                        }

                        // --- EXCEPCIONES PARA DIRECCIÓN GENERAL ---
                        let etiquetaResponsable = "Oficial";
                        let correoRaw = item.CORREO || item.Correo || "";
                        let correoHTML = "";

                        if (nombre === "DIRECCION GENERAL DEL REGISTRO CIVIL") {
                            etiquetaResponsable = "Directora General";
                            if (correoRaw && correoRaw.toLowerCase() !== "sin correo" && correoRaw.trim() !== "") {
                                correoHTML = `<div class="popup-item"><span class="popup-icon">✉️</span><span><a href="mailto:${correoRaw}" class="popup-link">${correoRaw}</a></span></div>`;
                            }
                        } else {
                            let textoCorreo = (correoRaw === "" || correoRaw.toLowerCase() === "sin correo") ? "Sin correo" : correoRaw;
                            correoHTML = `<div class="popup-item"><span class="popup-icon">✉️</span><span><a href="mailto:${textoCorreo}" class="popup-link">${textoCorreo}</a></span></div>`;
                        }

                        const oficial = item.OFICIAL || item.Oficial || item.oficial || "Responsable no asignado";
                        
                        let fotoTexto = item.FOTO || item.Foto || item.foto || "";
                        let imagenHTML = "";
                        if (fotoTexto !== "" && fotoTexto.toLowerCase() !== "sin foto") {
                            if (fotoTexto.includes('src="')) {
                                const match = fotoTexto.match(/src="([^"]+)"/);
                                if (match) fotoTexto = match[1];
                            }
                            imagenHTML = `<img src="${fotoTexto}" alt="Foto de ${oficial}" class="popup-avatar" onerror="this.style.display='none'">`;
                        }

                        let lat, lng;
                        const textoCoordenada = item.Coordenadas || item.coordenadas || item.Latitude || item.Longitude || item.COORDENADAS;
                        
                        if (textoCoordenada && typeof textoCoordenada === 'string' && textoCoordenada.includes(',')) {
                            const partes = textoCoordenada.split(',');
                            lat = parseFloat(partes[0].trim());
                            lng = parseFloat(partes[1].trim());
                        } else {
                            lat = parseFloat(item.Latitude || item.lat);
                            lng = parseFloat(item.Longitude || item.lng);
                        }

                        if(nombre && lat && lng && !isNaN(lat) && !isNaN(lng)) {
                            
                            let tieneCurp = String(item["MODULO CURP"] || item["Modulo CURP"] || item.curp || "NO").trim().toUpperCase();
                            let tieneBiometrico = String(item["BIOMETRICO"] || item["Biometrico"] || item.biometrico || "NO").trim().toUpperCase();

                            let colorHex = "";     
                            let curpHTML = "";     

                            if (tieneCurp === "SI" && tieneBiometrico === "SI") {
                                colorHex = "#BD9556"; 
                                curpHTML = `
                                    <div class="popup-item">
                                        <span class="popup-icon">✅</span>
                                        <span style="color: ${colorHex}; font-weight: bold;">Módulo CURP</span>
                                    </div>
                                    <div class="popup-item">
                                        <span class="popup-icon">👁️</span>
                                        <span style="color: ${colorHex}; font-weight: bold;">Módulo Biométrico</span>
                                    </div>
                                `;
                            } else if (tieneCurp === "SI" && tieneBiometrico !== "SI") {
                                colorHex = "#912F3C"; 
                                curpHTML = `
                                    <div class="popup-item">
                                        <span class="popup-icon">✅</span>
                                        <span style="color: ${colorHex}; font-weight: bold;">Módulo CURP</span>
                                    </div>
                                `;
                            } else {
                                colorHex = "#606062"; 
                                curpHTML = ``; 
                            }

                            const iconoPersonalizado = L.divIcon({
                                className: 'custom-pin',
                                html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="30" height="45"><path fill="${colorHex}" stroke="#ffffff" stroke-width="2" d="M12 0C5.373 0 0 5.373 0 12c0 8.442 11.144 23.322 11.535 23.82a.597.597 0 00.93 0C12.856 35.322 24 20.442 24 12c0-6.627-5.373-12-12-12zm0 17.5a5.5 5.5 0 110-11 5.5 5.5 0 010 11z"/></svg>`,
                                iconSize: [30, 45],
                                iconAnchor: [15, 45], 
                                popupAnchor: [0, -40] 
                            });

                            const marker = L.marker([lat, lng], { icon: iconoPersonalizado });

                            const popupContent = `
                                <div class="popup-header" style="background-color: ${colorHex};">${nombre}</div>
                                <div class="popup-body">
                                    ${imagenHTML}
                                    <div class="popup-item">
                                        <span class="popup-icon">👤</span>
                                        <span><b>${etiquetaResponsable}:</b> ${oficial}</span>
                                    </div>
                                    ${curpHTML}
                                    <div class="popup-item">
                                        <span class="popup-icon">📍</span>
                                        <span><a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="popup-link" title="Cómo llegar en Google Maps">${direccion}</a></span>
                                    </div>
                                    <div class="popup-item">
                                        <span class="popup-icon">📞</span>
                                        <div>${telefonoHTML}</div>
                                    </div>
                                    ${correoHTML}
                                </div>
                            `;

                            marker.bindPopup(popupContent, {
                                className: 'custom-popup',
                                closeButton: true, 
                                offset: [0, -20]
                            });

                            marker.on('mouseover', function (e) { this.openPopup(); });

                            grupoOficialias.addLayer(marker);
                            diccMarcadores[nombre] = marker; 

                            // --- NUEVO: Guardamos toda la data del marcador en nuestro arreglo ---
                            todosLosMarcadores.push({
                                marcador: marker,
                                tieneCurp: tieneCurp === "SI",
                                tieneBio: tieneBiometrico === "SI",
                                nombre: nombre
                            });

                            const opcion = document.createElement('option');
                            opcion.value = nombre;
                            datalist.appendChild(opcion);
                        }
                    });

                    // --- FUNCIÓN DE FILTRADO ---
                    function aplicarFiltros() {
                        const reqCurp = document.getElementById('chk-curp').checked;
                        const reqBio = document.getElementById('chk-bio').checked;

                        grupoOficialias.clearLayers(); // Vaciamos el mapa temporalmente

                        todosLosMarcadores.forEach(item => {
                            let pasaFiltro = true;
                            // Si el usuario pide CURP y la oficialía no tiene, se oculta
                            if (reqCurp && !item.tieneCurp) pasaFiltro = false;
                            // Si el usuario pide Biométrico y la oficialía no tiene, se oculta
                            if (reqBio && !item.tieneBio) pasaFiltro = false;

                            if (pasaFiltro) {
                                grupoOficialias.addLayer(item.marcador);
                            }
                        });
                    }

                    // Escuchamos cuando el usuario marque o desmarque las casillas
                    document.getElementById('chk-curp').addEventListener('change', aplicarFiltros);
                    document.getElementById('chk-bio').addEventListener('change', aplicarFiltros);


                    map.on('zoomend', function() {
                        const zoomActual = map.getZoom();
                        if (zoomActual >= NIVEL_ZOOM_VISIBLE) {
                            if (!map.hasLayer(grupoOficialias)) { map.addLayer(grupoOficialias); }
                        } else {
                            if (map.hasLayer(grupoOficialias)) { map.removeLayer(grupoOficialias); }
                        }
                    });

                    function ejecutarBusqueda(textoBusqueda) {
                        if(!textoBusqueda) return;
                        
                        const seleccionLimpia = textoBusqueda.trim().toLowerCase(); 
                        let markerEncontrado = null;
                        
                        for (const nombreMunicipio in diccMarcadores) {
                            if (nombreMunicipio.toLowerCase() === seleccionLimpia) {
                                markerEncontrado = diccMarcadores[nombreMunicipio];
                                break; 
                            }
                        }

                        if(markerEncontrado) {
                            // --- MAGIA NUEVA: Si el marcador estaba oculto por un filtro, lo forzamos a aparecer ---
                            if (!grupoOficialias.hasLayer(markerEncontrado)) {
                                grupoOficialias.addLayer(markerEncontrado);
                            }

                            const coordenadas = markerEncontrado.getLatLng();
                            map.flyTo(coordenadas, 15, { animate: true, duration: 1.5 }); 
                            
                            if(document.activeElement) document.activeElement.blur(); 

                            setTimeout(() => { markerEncontrado.openPopup(); }, 1500); 
                        }
                    }

                    document.getElementById('buscador-header').addEventListener('keyup', (e) => {
                        if (e.key === 'Enter') {
                            ejecutarBusqueda(e.target.value);
                        }
                    });

                    document.getElementById('buscador-header').addEventListener('blur', (e) => {
                        ejecutarBusqueda(e.target.value);
                    });

                    document.getElementById('buscador-pc').addEventListener('input', (e) => {
                        ejecutarBusqueda(e.target.value);
                    });

                    document.getElementById('btn-reset').addEventListener('click', () => {
                        map.flyToBounds(veracruzBounds);
                        document.getElementById('buscador-pc').value = '';
                        document.getElementById('buscador-header').value = '';
                        
                        // --- NUEVO: Limpiamos los filtros visualmente y en el mapa ---
                        document.getElementById('chk-curp').checked = false;
                        document.getElementById('chk-bio').checked = false;
                        aplicarFiltros();
                    });
                })
                .catch(error => {
                    console.error('Error cargando el archivo:', error);
                });
        });
    </script>
</body>
</html>
